name: Portfolio Quality & Sync CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate UI, Assets & Synced CV Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript Syntax
        run: |
          node --check assets/js/portfolio-data.js
          node --check assets/js/app.js
          node --check scripts/validate-portfolio.mjs

      - name: Run Portfolio & Brand Integrity Suite
        run: node scripts/validate-portfolio.mjs
